# Configuración central del pipeline de ingeniería de datos.
# Entrega 1 — Ajedrez competitivo online (Chess.com) (UTN FRM, Ciencia de Datos 2026).

chess_com:
  base_url: "https://api.chess.com/pub/player"
  # La lista de jugadores NO vive acá: la arma listar_jugadores en la primera corrida
  # (ver player_selection) y queda congelada en player_selection.selection_path.
  max_games_per_user: 1000
  time_classes:
    - bullet
    - blitz
    - rapid
  rules: "chess"
  rated_only: true
  raw_filename_template: "chesscom_{username}_raw.json"
  # Chess.com pide un User-Agent que identifique al cliente y sea contactable.
  user_agent: "chess-outcome-prediction-utnfrm/1.0 (+https://github.com/BautistaAlosMartorell/chess-outcome-prediction)"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  clean_parquet: "data/processed/partidas_ajedrez_clean.parquet"
  clean_sample_csv: "data/processed/partidas_ajedrez_clean_sample.csv"
  summary_json: "data/processed/data_summary.json"

processing:
  sample_size: 5000
  random_state: 42

# Requisito del dataset que se entrega: se controla DESPUÉS de parsear,
# deduplicar y limpiar. No se deriva del mínimo de descarga porque son etapas
# con contratos distintos.
quality:
  min_final_games: 1500

elo:
  bandas:
    principiante: [0, 1200]
    intermedio: [1200, 1800]
    avanzado: [1800, 2200]
    experto: [2200, 2600]
    top_mundial: [2600, 4000]

download:
  timeout_seconds: 60
  max_retries: 5
  backoff_factor: 2
  request_delay_seconds: 0.25
  # Ventana temporal congelada: se ignoran los archivos mensuales posteriores a
  # este mes (YYYY-MM). Fija el dataset para la Entrega 1 — una corrida desde cero
  # produce el mismo conjunto de partidas. Poner null para tomar hasta el mes actual.
  until_month: "2026-08"
  # Umbrales mínimos de la descarga cruda tras tolerar fallos por usuario
  # (cuenta borrada, sin partidas, red). Por debajo de esto la descarga corta con error.
  # Con ~100 jugadores seleccionados se tolera que falle hasta ~20 %.
  min_users_ok: 80
  min_total_games: 1500

# Política de selección de jugadores ejecutada por listar_jugadores en el DAG.
# Primera corrida (no existe selection_path): arma el universo de candidatos con las listas
# públicas de jugadores por país y de titulados de la PubAPI, lo baraja con random_state,
# estima la banda de cada candidato con /stats, lo valida contra sus partidas hasta cutoff
# y llena target_per_band. El resultado se escribe en selection_path y queda CONGELADO:
# las corridas siguientes descargan exactamente la misma lista. Para volver a seleccionar,
# borrar ese archivo a mano.
player_selection:
  source: "listas públicas de jugadores por país y titulados de la PubAPI de Chess.com"
  countries: [AR, ES, MX, US, IN, BR, DE, RU]
  # Las listas por país casi no tienen jugadores de 2600+: los titulados cubren top_mundial.
  titles: [GM, IM, WGM, FM]
  cutoff: "2026-08"
  random_state: 42
  min_eligible_games: 15
  max_games_per_candidate: 1000
  # 100 jugadores, 20 por banda de ELO. Si una banda no alcanza el target, se loguea un
  # warning y se sigue con lo conseguido.
  target_per_band:
    principiante: 20
    intermedio: 20
    avanzado: 20
    experto: 20
    top_mundial: 20
  # Lista congelada + manifiesto (candidatos evaluados y motivos de rechazo). Junto a él
  # quedan los snapshots crudos de las listas por país/título (bronce de la selección).
  selection_path: "data/raw/seleccion/jugadores_seleccionados.yaml"
