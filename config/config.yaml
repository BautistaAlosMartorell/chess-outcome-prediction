# Configuración central del pipeline de ingeniería de datos.
# Entrega 1 — Ajedrez competitivo online (Lichess) (UTN FRM, Ciencia de Datos 2026).

lichess:
  base_url: "https://lichess.org/api/games/user"
  # Jugadores activos y reales en distintos rangos de ELO (blitz), para que el
  # dataset tenga diversidad genuina de nivel y no solo partidas de una persona.
  # Verificado contra la API real: perfiles públicos existentes en Lichess.
  usernames:
    - thibault          # fundador de Lichess, nivel club (~1700-1800 blitz)
    - DrNykterstein      # Magnus Carlsen, top mundial (~3200+ bullet/blitz)
    - Zhigalko_Sergei    # GM, nivel top
    - Konevlad           # GM, nivel top
    - RebeccaHarris      # nivel club/intermedio
    - penguingim1        # streamer, nivel fuerte
    - Bombegranate       # nivel intermedio
    - Msb2                     # nivel intermedio
  max_games_per_user: 1000
  perf_types: "bullet,blitz,rapid"
  rated_only: true
  raw_filename_template: "lichess_{username}_raw.pgn"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  clean_parquet: "data/processed/partidas_ajedrez_clean.parquet"
  clean_sample_csv: "data/processed/partidas_ajedrez_clean_sample.csv"
  summary_json: "data/processed/data_summary.json"

processing:
  sample_size: 5000
  random_state: 42

elo:
  # Bandas de ELO para la feature categórica nivel_promedio.
  bandas:
    principiante: [0, 1200]
    intermedio: [1200, 1800]
    avanzado: [1800, 2200]
    experto: [2200, 2600]
    top_mundial: [2600, 4000]

download:
  timeout_seconds: 60
  max_retries: 5
  backoff_factor: 2
