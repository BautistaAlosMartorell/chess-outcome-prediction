# Configuración central del pipeline de ingeniería de datos.
# Entrega 1 — Ajedrez competitivo online (Chess.com) (UTN FRM, Ciencia de Datos 2026).

chess_com:
  base_url: "https://api.chess.com/pub/player"
  # La lista de jugadores NO vive acá: la arma listar_jugadores en la primera corrida
  # (ver player_selection) y queda congelada en player_selection.selection_path.
  max_games_per_user: 1000
  time_classes:
    - bullet
    - blitz
    - rapid
  rules: "chess"
  rated_only: true
  raw_filename_template: "chesscom_{username}_raw.json"
  # Chess.com pide un User-Agent que identifique al cliente y sea contactable.
  user_agent: "chess-outcome-prediction-utnfrm/1.0 (+https://github.com/BautistaAlosMartorell/chess-outcome-prediction)"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  clean_parquet: "data/processed/partidas_ajedrez_clean.parquet"
  clean_sample_csv: "data/processed/partidas_ajedrez_clean_sample.csv"
  summary_json: "data/processed/data_summary.json"

processing:
  sample_size: 5000
  random_state: 42

# Requisito del dataset que se entrega: se controla DESPUÉS de parsear,
# deduplicar y limpiar. No se deriva del mínimo de descarga porque son etapas
# con contratos distintos.
quality:
  min_final_games: 1500

elo:
  bandas:
    principiante: [0, 1200]
    intermedio: [1200, 1800]
    avanzado: [1800, 2200]
    experto: [2200, 2600]
    top_mundial: [2600, 4000]

# Matchup de apertura por color: primera jugada de blancas x primera respuesta de
# negras (SAN). Taxonomía propia del equipo, NO el estándar ECO. La lista está
# CONGELADA: son las 17 combinaciones más frecuentes de la corrida del 26/09/2026
# (76.803 partidas; juntas cubren el 80,39 %, la menor tiene 760 partidas y ninguna
# baja de 96 dentro de un mismo TimeClass). Lo demás cae en "otra". No se recalcula
# por corrida: si cambiara, la categoría de una misma partida cambiaría con los datos.
matchup_apertura:
  categorias:
    - e4-e5
    - e4-c5
    - d4-Nf6
    - d4-d5
    - e4-e6
    - e4-c6
    - e4-d5
    - e4-d6
    - e4-g6
    - Nf3-Nf6
    - d4-e6
    - Nf3-d5
    - c4-e5
    - d4-d6
    - e4-Nf6
    - d4-g6
    - c4-Nf6
  # Mínimo de partidas previas (del mismo matchup y TimeClass, terminadas antes de que
  # empiece la partida) para publicar una tasa histórica. Debajo queda NaN.
  min_partidas_previas: 30

download:
  timeout_seconds: 60
  max_retries: 5
  backoff_factor: 2
  request_delay_seconds: 0.25
  # Ventana temporal congelada: se ignoran los archivos mensuales posteriores a
  # este mes (YYYY-MM). Fija el dataset para la Entrega 1 — una corrida desde cero
  # produce el mismo conjunto de partidas. Poner null para tomar hasta el mes actual.
  until_month: "2026-08"
  # Umbrales mínimos de la descarga cruda tras tolerar fallos por usuario
  # (cuenta borrada, sin partidas, red). Por debajo de esto la descarga corta con error.
  # Con ~100 jugadores seleccionados se tolera que falle hasta ~20 %.
  min_users_ok: 80
  min_total_games: 1500

# Política de selección de jugadores ejecutada por listar_jugadores en el DAG.
# Primera corrida (no existe selection_path): arma cada pool de candidatos con listas
# públicas de la PubAPI, lo baraja con random_state, estima la banda de cada candidato con
# /stats, lo valida contra sus partidas hasta cutoff y llena target_per_band. Los pools se
# recorren en ronda (uno por turno) y cada uno se abandona cuando todas sus `bands` están
# llenas, sin gastar más requests. El avance se guarda en un checkpoint
# (<selection_path>.parcial.yaml) para que un reintento siga desde ahí.
# El resultado se escribe en selection_path y queda CONGELADO: las corridas siguientes
# descargan exactamente la misma lista. Para volver a seleccionar, borrar ese archivo.
player_selection:
  source: "listas públicas de titulados y de jugadores por país de la PubAPI de Chess.com"
  # Cada pool declara las `bands` que alimenta: cuando todas están llenas, el pool se deja
  # de recorrer. Un candidato que cae en otra banda todavía abierta igual se acepta.
  # El orden importa: un jugador que figura en dos pools queda sólo en el primero.
  # Solo títulos abiertos (los obtiene cualquiera): no se usan listas exclusivas de un
  # género (WGM, WIM, WFM, WCM) para no sesgar ninguna banda por género.
  # Las bandas salen de medir qué niveles aporta cada lista (muestras de /stats del
  # 22/09/2026): países → 0/80 en 1800+ (casi todo principiante); FM → 3/20, NM → 2/20 y
  # CM → 1/20 en avanzado (el resto 2200+); GM/IM → 2200+. La API no publica ninguna
  # lista de jugadores de 1800-2200 sin título: FM/CM/NM es la fuente abierta más cercana.
  pools:
    titulados_avanzado:
      titles: [FM, CM, NM]
      bands: [avanzado]
    titulados_alto:
      titles: [GM, IM]
      bands: [experto, top_mundial]
    paises:
      countries: [AR, ES, MX, US, IN, BR, DE, RU]
      bands: [principiante, intermedio]
  cutoff: "2026-08"
  random_state: 42
  min_eligible_games: 15
  max_games_per_candidate: 1000
  # 100 jugadores, 20 por banda de ELO. Si una banda no alcanza el target, se loguea un
  # warning y se sigue con lo conseguido.
  target_per_band:
    principiante: 20
    intermedio: 20
    avanzado: 20
    experto: 20
    top_mundial: 20
  # Lista congelada + manifiesto (candidatos evaluados y motivos de rechazo). Junto a él
  # quedan los snapshots crudos de las listas por país/título (bronce de la selección).
  selection_path: "data/raw/seleccion/jugadores_seleccionados.yaml"
