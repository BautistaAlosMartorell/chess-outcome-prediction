# docker-compose.yml — Stack de Airflow 3.3 para el pipeline de Ajedrez (UTN FRM 2026)
#
# Servicios:
#   postgres              — base de datos de metadatos de Airflow
#   redis                 — broker de Celery (executor distribuido)
#   airflow-init          — migra la BD y crea el usuario admin (corre una sola vez)
#   airflow-apiserver     — interfaz web + API en http://localhost:8080 (antes: webserver)
#   airflow-scheduler     — decide qué tarea está lista y la manda a ejecutar
#   airflow-dag-processor — parsea los .py de dags/ (proceso aparte desde Airflow 3)
#   airflow-triggerer     — maneja las esperas asincrónicas (deferrable operators)
#   airflow-worker        — ejecuta las tareas (CeleryExecutor)
#
# Uso rápido:
#   cp .env.example .env             # la primera vez
#   docker compose up airflow-init   # migra la BD y crea el admin (una sola vez)
#   docker compose up -d             # levanta toda la stack
#   docker compose down              # apaga (los volúmenes persisten)
#   docker compose down -v           # apaga Y borra volúmenes (reset total)

x-airflow-common: &airflow-common
  build: .
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Airflow 3: los workers hablan con el api-server por la Task Execution API.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    # Airflow 3: secreto para firmar los JWT entre workers y api-server.
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW__API_AUTH__JWT_SECRET:-dev_jwt_secret_cambiar_en_produccion}"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Expone el src/ del proyecto dentro del contenedor
    PYTHONPATH: "/project:/opt/airflow"
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # data/ montada para que el pipeline escriba en el host
    - ./data:/project/data
    # config/ y src/ también montados para hot-reload durante desarrollo
    - ./src:/project/src
    - ./config:/project/config
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # El entrypoint estándar de la imagen migra la BD (airflow db migrate) y crea
    # el usuario admin vía FAB cuando ve _AIRFLOW_DB_MIGRATE / _AIRFLOW_WWW_USER_CREATE.
    command:
      - -c
      - |
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "TriggererJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
